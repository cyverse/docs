docs_dir: docs/
site_name: CyVerse Core Software Documentation
site_url: https://cyverse.github.io/docs
site_description: CyVerse USA Documentation
site_author: 'CyVerse USA'

# NOTE: the published site is built with Zensical (see zensical.toml, which is
# what .github/workflows/gh-actions.yml runs). This file is kept in sync for
# local `mkdocs serve` previews; change both when the navigation changes.

# uncomment to show the github icon in the header with
# number of forks & stars
repo_url: https://github.com/cyverse/docs
edit_uri: edit/main/docs

# Copyright
copyright: 'Copyright &copy; 2016-2026 CyVerse'

# JavaScript for Intercom Widget
extra_javascript:
  - javascripts/intercom.js

imgwidth: 70px;
theme:
  highlightjs: true
  name: material
  font:
    text: 'Open Sans'
    code: 'Roboto Mono'
  logo: 'assets/de/cyverse_ball_2022.png'
  favicon: 'images/favicon.ico'
# setting features for the navigation tab
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - toc.integrate
    - toc.follow
  # Default values, taken from mkdocs_theme.yml
  language: en
  # custom_dir: 'overrides'
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: white)"
      primary: 'white'
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to system preference

# Navigation pane. Ordered to follow a CyVerse deployment: plan, build the
# foundation, then the layers above it, then operate what you built.

nav:
  - Home:
    - index.md
    - About: 'about.md'
    - Update Log: 'log.md'
  - Architecture:
    - architecture/index.md
    - System Overview: 'architecture/system-overview.md'
    - Component Inventory & Sizing: 'architecture/component-inventory.md'
    - Network Requirements: 'architecture/network-requirements.md'
    - Kubernetes Namespaces: 'architecture/namespaces.md'
  - Deployment:
    - deployment/index.md
    - From Scratch: 'deployment/from-scratch.md'
    - 'Phase 0: Planning':
      - deployment/planning/index.md
      - Prerequisites: 'deployment/planning/prerequisites.md'
      - Ansible: 'deployment/planning/ansible.md'
      - Docker: 'deployment/planning/docker.md'
    - 'Phase 1: Foundation':
